# CIRRUS cluster access, baked into the image.
#
# Every user gets the same file, and that is not a shortcut: this config contains
# no per-user material. It is clusters, contexts, and an exec block naming public
# Entra app-registration IDs (server-id / client-id / tenant-id) with the cluster
# CA embedded. Identity arrives at runtime, when each person completes their own
# device-code sign-in. There is nothing here to leak.
#
# It exists so a session works with an empty GLADE home. cirrus-kubeconfig-src
# prefers a user's own ~/.kube/cirrus-config when they have one, and falls back
# here otherwise -- so this is a floor, not an override.
#
# Namespaces are deliberately absent: cirrus-kubeconfig-init sets the namespace on
# the selected context from CIRRUS_NAMESPACE (or ood-<user>).
#
# MAINTENANCE: this pins the cluster CA and the app registration into the image.
# If CIRRUS rotates either, this file must be regenerated and the image rebuilt --
# or, as a stopgap, a corrected ~/.kube/cirrus-config dropped in a user's home,
# which takes precedence. Regenerate with:
#   yq '(.contexts[].context) |= del(.namespace) | .current-context = "mlc1"' \
#       ~/.kube/config > etc/cirrus/kubeconfig.yaml
apiVersion: v1
clusters:
  - cluster:
      certificate-authority-data: 
      server: https://mlc1-user.k8s.ucar.edu:443
    name: mlc1-user
  - cluster:
      certificate-authority-data: 
      server: https://nwc1-user.k8s.ucar.edu:443
    name: nwc1-user
contexts:
  - context:
      cluster: mlc1-user
      user: oidc
    name: mlc1
  - context:
      cluster: nwc1-user
      user: oidc
    name: nwc1
current-context: mlc1
kind: Config
users:
  - name: oidc
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        args:
          - get-token
          - --environment
          - AzurePublicCloud
          - --server-id
          - e2189590-e7e3-494a-965f-0567d8c4acd3
          - --client-id
          - e2189590-e7e3-494a-965f-0567d8c4acd3
          - --tenant-id
          - a85e7773-09e6-4cce-aa58-664ddb1aca42
          - --timeout
          - 120s
        command: kubelogin
        env: null
        interactiveMode: IfAvailable
        provideClusterInfo: false
