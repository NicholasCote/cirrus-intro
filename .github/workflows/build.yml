name: Build and push workshop image

on:
  workflow_dispatch:
  push:
    paths:
      - cirrus-workshop-image/**
      - .github/workflows/build.yml
    branches:
      - main

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d.%H.%M')" >> $GITHUB_OUTPUT

      - name: registry login
        uses: docker/login-action@v3
        with:
          registry: hub.k8s.ucar.edu
          username: ${{ secrets.HARBOR_LOGIN }}
          password: ${{ secrets.HARBOR_SECRET }}

      # The image lives in a subdirectory, so the build context and the
      # Dockerfile are both named explicitly -- everything else here is the
      # runner's stock buildx.
      - name: Build image
        run: |
          docker buildx build \
            -t hub.k8s.ucar.edu/ncote/cirrus-workshop:${{ steps.date.outputs.date }} \
            -f cirrus-workshop-image/Dockerfile \
            cirrus-workshop-image

      - name: Push image to Harbor
        run: docker push hub.k8s.ucar.edu/ncote/cirrus-workshop:${{ steps.date.outputs.date }}
