name: Build and push workshop image

on:
  workflow_dispatch:
  push:
    paths:
      - cirrus-workshop-image/**
      - .github/workflows/build.yml
    branches:
      - main

permissions:
  contents: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d.%H.%M')" >> $GITHUB_OUTPUT

      - name: registry login
        uses: docker/login-action@v3
        with:
          registry: hub.k8s.ucar.edu
          username: ${{ secrets.HARBOR_LOGIN }}
          password: ${{ secrets.HARBOR_SECRET }}

      - name: Build image
        run: |
          docker buildx build \
            -t hub.k8s.ucar.edu/ncote/cirrus-workshop:${{ steps.date.outputs.date }} \
            -f cirrus-workshop-image/Dockerfile \
            cirrus-workshop-image

      - name: Push image to Harbor
        run: docker push hub.k8s.ucar.edu/ncote/cirrus-workshop:${{ steps.date.outputs.date }}

      - name: Point submit.yml.erb at the new image
        run: |
          sed -i \
            -E 's|(hub\.k8s\.ucar\.edu/ncote/cirrus-workshop:)[^"]*|\1${{ steps.date.outputs.date }}|' \
            submit.yml.erb
          git diff --quiet submit.yml.erb && echo "no change" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submit.yml.erb
          git commit -m "Update workshop image to ${{ steps.date.outputs.date }}"
          git push
